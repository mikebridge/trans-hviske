[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-hviske"
version = "0.1.0"
description = "Generate bilingual Danish+English WebVTT subtitles from audio using WhisperX"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "whisperx",
]

[project.scripts]
trans-hviske = "trans_hviske:main"

[tool.setuptools]
py-modules = ["trans_hviske"]
