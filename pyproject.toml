[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trans-hviske"
version = "0.1.0"
description = "Generate single-language WebVTT subtitles from audio using WhisperX (defaults to Danish)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "whisperx",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
trans-hviske = "trans_hviske:main"

[tool.setuptools]
py-modules = ["trans_hviske"]
